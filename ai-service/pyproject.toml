[project]
name = "classmate-ai-service"
version = "0.1.0"
description = "Internal API and workflow contracts for Classmate's Python AI service."
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1,<2",
    "fastapi>=0.115,<1",
    "langchain-huggingface>=1,<2",
    "langchain-text-splitters>=1,<2",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "pypdf>=7.1.1,<8",
    "sentence-transformers>=5,<6",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]
addopts = "-ra"
