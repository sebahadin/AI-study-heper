[project]
name = "classmate-ai-service"
version = "0.1.0"
description = "Contracts and planned interfaces for Classmate's Python AI service."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2,<3"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]
addopts = "-ra"
